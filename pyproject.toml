[project]
name = "ai-report-automation"
version = "0.1.0"
description = "Monthly KPI report: SQL KPIs -> Claude-written executive narrative (number-checked) -> HTML report -> e-mail, on a GitHub Actions schedule."
requires-python = ">=3.10"
dependencies = ["anthropic>=0.40", "duckdb>=1.1", "pandas>=2.1", "numpy>=1.26", "matplotlib>=3.8", "jinja2>=3.1", "markdown>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pre-commit>=3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
