name: Monthly sales report

on:
  schedule:
    - cron: "30 3 1 * *"   # 09:00 IST on the 1st of every month
  workflow_dispatch:
    inputs:
      month:
        description: "Month to report (YYYY-MM)"
        default: "2025-12"

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and e-mail report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        # The demo data ends in Dec 2025, so scheduled runs report that month.
        run: PYTHONPATH=src python -m reportbot.cli --month "${{ github.event.inputs.month || '2025-12' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sales-report
          path: out/
